<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hotel Aspect AI QA Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand-wrapper">
                    <div class="brand-icon-box">
                        <!-- Hotel Building SVG -->
                        <svg class="svg-icon" viewBox="0 0 24 24">
                            <path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16M9 7h1M9 11h1M9 15h1M14 7h1M14 11h1M14 15h1M10 21v-3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3"/>
                        </svg>
                    </div>
                    <div class="brand-text">
                        <h1>Hotel QA CHATBOT</h1>
                    </div>
                </div>
                <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Collapse Sidebar" title="Collapse sidebar">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>

            <div class="sidebar-content">
                <!-- New Conversation Button -->
                <button class="new-conversation-btn" id="newChatBtn">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    <span>New Conversation</span>
                </button>

                <!-- Pinned Conversations Section -->
                <div class="conv-section" id="pinnedSection" style="display: none;">
                    <div class="sidebar-section-title">
                        <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
                            <line x1="12" y1="17" x2="12" y2="22"/>
                            <path d="M5 17h14l-2-6V4H7v7l-2 6z"/>
                            <line x1="9" y1="4" x2="9" y2="2"/>
                            <line x1="15" y1="4" x2="15" y2="2"/>
                        </svg>
                        <span>Pinned</span>
                    </div>
                    <div class="conv-list" id="pinnedList"></div>
                </div>

                <!-- Recent Conversations Section -->
                <div class="conv-section" id="recentSection">
                    <div class="sidebar-section-title">
                        <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                        <span>Recent</span>
                    </div>
                    <div class="conv-list" id="recentList"></div>
                </div>
            </div>

            <div class="sidebar-footer">
                <!-- Light / Dark Mode Switch -->
                <div class="theme-switch-row">
                    <span class="theme-switch-label">
                        <span id="themeLabelText">Dark Mode</span>
                    </span>
                    <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle Light and Dark Mode">
                        <!-- Sun Icon (for switching to light) -->
                        <svg class="svg-icon icon-sun" id="sunIcon" viewBox="0 0 24 24" style="display: none;">
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/>
                            <line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/>
                            <line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                        <!-- Moon Icon (for switching to dark) -->
                        <svg class="svg-icon icon-moon" id="moonIcon" viewBox="0 0 24 24">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Mobile Sidebar Backdrop Scrim -->
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <!-- Transparent Top Bar -->
            <header class="chat-header">
                <div class="header-left">
                    <button class="sidebar-toggle-btn" id="sidebarToggleBtn" aria-label="Toggle Sidebar" title="Toggle Sidebar">
                        <!-- Menu / Sidebar SVG -->
                        <svg class="svg-icon" viewBox="0 0 24 24">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <line x1="9" y1="3" x2="9" y2="21"/>
                        </svg>
                    </button>
                    <div class="header-title-block">
                        <h2 id="activeChatTitle">New Conversation</h2>
                    </div>
                </div>
                <div class="header-right">
                    <!-- Model Status Pill -->
                    <div class="model-status-pill" id="modelStatusPill" title="Active Model Checkpoint">
                        <span class="pulse-dot"></span>
                        <span class="model-status-name" id="modelStatusLabel">Seq2Seq Engine</span>
                        <span class="model-badge" id="modelTypeBadge">Ready</span>
                    </div>

                    <!-- Upload Model Button -->
                    <button class="topbar-btn upload-btn" id="topbarUploadBtn" title="Upload custom model checkpoint (.pt, .bin, .safetensors)">
                        <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                        </svg>
                        <span>Upload Model</span>
                    </button>

                    <!-- Upload Progress Chip -->
                    <div class="upload-progress-chip" id="uploadProgressChip" style="display: none;">
                        <span class="upload-spinner"></span>
                        <span id="uploadProgressText">0%</span>
                    </div>

                    <input type="file" id="modelFileInput" accept=".pt,.bin,.safetensors">
                </div>
            </header>

            <!-- Messages Scroll Area (with Scroll Fade Mask) -->
            <div class="messages-container" id="messagesContainer">
                <div class="messages-content-wrap" id="messagesList">
                    <!-- Welcome Hero -->
                    <div class="welcome-hero" id="welcomeHero">
                        <div class="welcome-logo">
                            <!-- Hotel AI Sparkle SVG -->
                            <svg class="svg-icon svg-icon-lg" viewBox="0 0 24 24">
                                <path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16M9 7h1M9 11h1M9 15h1M14 7h1M14 11h1M14 15h1M10 21v-3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3"/>
                            </svg>
                        </div>
                        <h3>Welcome to Hotel QA Chatbot</h3>
                        <p>Ask aspect-based questions about hotels, guest reviews, amenities, and locations.</p>
                        <div class="chips-container">
                            <button type="button" class="suggestion-chip" data-query="Imperial Hotel Vũng Tàu chất lượng phòng thế nào?">
                                <span>Imperial Hotel Vũng Tàu chất lượng phòng thế nào?</span>
                            </button>
                            <button type="button" class="suggestion-chip" data-query="Khách sạn nào ở Đà Nẵng phục vụ tốt?">
                                <span>Khách sạn nào ở Đà Nẵng phục vụ tốt?</span>
                            </button>
                            <button type="button" class="suggestion-chip" data-query="Đánh giá đồ ăn sáng tại Pullman Hotel">
                                <span>Đánh giá đồ ăn sáng tại Pullman Hotel</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Floating Frosted Glass Prompt Bar -->
            <div class="prompt-bar-container">
                <form class="prompt-bar-glass" id="chatForm">
                    <textarea 
                        class="prompt-input-area" 
                        id="promptInput" 
                        placeholder="Ask about a hotel" 
                        rows="1"
                        autocomplete="off"
                    ></textarea>
                    <div class="prompt-actions">
                        <button type="submit" class="send-btn" id="sendBtn" aria-label="Send query" disabled>
                            <!-- Send Paper Airplane SVG -->
                            <svg class="svg-icon" viewBox="0 0 24 24">
                                <line x1="22" y1="2" x2="11" y2="13"/>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
